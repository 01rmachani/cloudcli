version: "3.9"

services:
  cloudcli:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudcli:local
    container_name: cloudcli
    ports:
      - "3001:3001"
    environment:
      # OAuth2 proxy headers — override these for your user
      X_AUTH_REQUEST_USER: ${X_AUTH_REQUEST_USER:-admin}
      X_AUTH_REQUEST_EMAIL: ${X_AUTH_REQUEST_EMAIL:-admin@example.com}
      # Database location (persisted via volume)
      DATABASE_PATH: ${DATABASE_PATH:-/root/.cloudcli/auth.db}
      # Platform mode (keep true for multi-user deployments)
      VITE_IS_PLATFORM: ${VITE_IS_PLATFORM:-true}
    volumes:
      - cloudcli-data:/root/.cloudcli
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  cloudcli-data:
    driver: local
